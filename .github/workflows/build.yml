name: Build

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: nagato
            output_name: nagato-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: nagato.exe
            output_name: nagato-windows-amd64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        env:
          NAGATO_VERSION: ${{ inputs.version }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifact/${{ matrix.output_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: artifact

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Organize files
        run: |
          mkdir dist
          cp artifacts/linux-x86_64/* dist/
          cp artifacts/windows-x86_64/* dist/

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
