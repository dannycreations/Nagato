name: 'Setup Nagato'
description: 'Download and install the nagato CLI'

inputs:
  version:
    description: 'The version of nagato to install'
    required: false
    default: 'nightly'

runs:
  using: 'composite'

  steps:
    - name: Get nagato
      id: get_download_url
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"

        if [ "$VERSION" = "latest" ]; then
          URL="https://api.github.com/repos/dannycreations/nagato/releases/latest"
        else
          URL="https://api.github.com/repos/dannycreations/nagato/releases/tags/$VERSION"
        fi

        echo "Fetching release information from:"
        echo "$URL"

        RESPONSE=$(curl -fsSL \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$URL")

        echo "Release:"
        echo "$RESPONSE" | jq -r '.tag_name // "unknown"'

        if [ "${RUNNER_OS}" = "Linux" ]; then
          ASSET_NAME="nagato-linux-amd64"
        elif [ "${RUNNER_OS}" = "Windows" ]; then
          ASSET_NAME="nagato-windows-amd64.exe"
        else
          echo "Unsupported runner OS: ${RUNNER_OS}"
          exit 1
        fi

        DOWNLOAD_URL=$(echo "$RESPONSE" | jq -er \
          --arg asset "$ASSET_NAME" \
          '.assets[] | select(.name == $asset) | .browser_download_url')

        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Could not find asset: $ASSET_NAME"
          echo "Available assets:"
          echo "$RESPONSE" | jq -r '.assets[]?.name'
          exit 1
        fi

        echo "Found download URL:"
        echo "$DOWNLOAD_URL"

        echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

    - name: Download nagato
      shell: bash
      run: |
        set -euo pipefail

        NAGATO_PATH="${{ runner.temp }}/nagato"

        mkdir -p "$NAGATO_PATH"

        if [ "${RUNNER_OS}" = "Linux" ]; then
          curl -fL \
            -o "$NAGATO_PATH/nagato" \
            "${{ steps.get_download_url.outputs.DOWNLOAD_URL }}"

          chmod +x "$NAGATO_PATH/nagato"

        elif [ "${RUNNER_OS}" = "Windows" ]; then
          curl -fL \
            -o "$NAGATO_PATH/nagato.exe" \
            "${{ steps.get_download_url.outputs.DOWNLOAD_URL }}"
        fi

        echo "$NAGATO_PATH" >> "$GITHUB_PATH"
