[workspace]
resolver = "2"
members = ["crates/nagato_apply", "crates/nagato_cli", "crates/nagato_core"]

[workspace.package]
authors = ["dannycreations"]
edition = "2021"
license = "GPL"
repository = "https://github.com/dannycreations/Nagato"

[workspace.dependencies]
aho-corasick = "1.1.4"
assert_cmd = "2.1.1"
bstr = "1.12.1"
clap = { version = "4.5.53", features = ["derive"] }
indoc = "2.0.7"
memchr = "2.7.6"
memmap2 = "0.9.9"
nagato_apply = { path = "crates/nagato_apply" }
nagato_core = { path = "crates/nagato_core" }
once_cell = "1.21.3"
predicates = "3.1.3"
tempfile = "3.23.0"
thiserror = "2.0.17"

[profile.release]
codegen-units = 1
incremental = true
lto = true
opt-level = 'z'
split-debuginfo = "packed"
debug = "line-tables-only"
