[workspace]
resolver = "2"
members = ["crates/nagato_apply", "crates/nagato_cli", "crates/nagato_core"]

[workspace.package]
authors = ["dannycreations"]
edition = "2021"
license = "GPL"
repository = "https://github.com/dannycreations/Nagato"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.2"
bstr = { version = "1.12.1", features = ["std"] }
clap = { version = "4.5.54", features = ["derive"] }
criterion = "0.8.1"
flate2 = "1.1.8"
hex = "0.4.3"
indoc = "2.0.7"
memchr = "2.7.6"
memmap2 = "0.9.9"
nagato_apply = { path = "crates/nagato_apply" }
nagato_core = { path = "crates/nagato_core" }
predicates = "3.1.3"
sha1 = "0.10.6"
tempfile = "3.24.0"
thiserror = "2.0.18"

[profile.dev]
codegen-units = 16
debug = 1
incremental = true

[profile.release]
codegen-units = 1
debug = "line-tables-only"
incremental = false
lto = true
opt-level = 3
panic = "abort"
split-debuginfo = "packed"
